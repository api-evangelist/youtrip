name: Youtrip
description: >-
  YouTrip (You Technologies Group, you.co) is a Singapore-based fintech that
  operates a multi-currency mobile travel wallet paired with a prepaid
  Mastercard, letting consumers hold and spend in over 150 currencies with no
  foreign-exchange fees and competitive in-app exchange rates. Launched in 2018,
  the company also runs YouBiz, a business account and corporate card product
  for SMEs, and offers international transfers to more than 40 countries. Backed
  by Lightspeed Venture Partners, YouTrip processes billions of dollars in
  transactions annually across Singapore, Thailand, and Australia. As of this
  enrichment pass YouTrip exposes no public developer API, developer portal,
  OpenAPI specification, SDKs, or GitHub organization; consumer-facing account
  access is available only indirectly through open-banking aggregators.
